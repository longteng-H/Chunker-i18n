name: Dependency Submission

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # 说明：仓库未开启 Dependency graph 时，提交快照会返回
      # "The Dependency graph is disabled for this repository"（该开关只能在
      # Settings → Code security and analysis → Dependency graph 手动打开，REST API 无法修改）。
      # 依赖图生成本身是成功的，此处不因提交失败而让整个 workflow 变红。
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        continue-on-error: true
